server:
  port: 8080
  tomcat:
    threads:
      max: 10
      min-spare: 2
    max-connections: 100
spring:
  # NOTE: do NOT enable spring.main.lazy-initialization. Under GraalVM native-image, Spring AOT
  # bakes the lazy flag into every bean definition at build time, including Temporal's
  # `workerFactoryStarter` ApplicationListener. A lazy listener is never instantiated, so it never
  # receives ApplicationReadyEvent and the Temporal worker never starts (workflows silently time out).
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:placeholder}
  application:
    name: events-workflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/events}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${DB_URL:jdbc:postgresql://localhost:5432/events}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: true
    detect-encoding: false
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.lob.non_contextual_creation: true
  temporal:
    connection:
      target: ${TEMPORAL_URL:localhost:7233}
    workers:
      - name: telegram-worker
        task-queue: TelegramMessageQueue
        workflow-classes:
          - md.address.events.workflows.TelegramMessageProcessWorkflow
    workersAutoDiscovery:
      packages: md.address.events.workflows
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      region:
        static: ${AWS_REGION:us-east-1}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true