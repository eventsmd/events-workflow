name: Build Native OCI image

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: '25'
  IMAGE_NAME: ghcr.io/${{ github.repository }}:${{ github.sha }}-native

jobs:
  build-native-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Configure GitHub Packages (GHCR) login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native image with Maven
        run: |
          ./mvnw -B -Pnative -DskipTests spring-boot:build-image \
            -Dspring-boot.build-image.imageName=${IMAGE_NAME}

      - name: Push image to GHCR
        run: |
          docker push ${IMAGE_NAME}
